name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  # one adapter trace per debug session, uploaded when something fails: the only way to diagnose a platform nobody has at hand
  DOTNET_DEBUGGER_TEST_LOG: ${{ github.workspace }}/artifacts/test-logs/
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS has never been verified: its result is wanted, but must not block anything yet.
    # (Linux x64 was verified in Docker, see build/test-in-docker.ps1.) Remove "experimental" once a platform is green.
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest, rid: win-x64, experimental: false }
          - { name: Linux x64, os: ubuntu-latest, rid: linux-x64, experimental: false }
          - { name: macOS arm64, os: macos-latest, rid: osx-arm64, experimental: true }
    steps:
      - uses: actions/checkout@v4

      # 9: the adapter and the tests; 8 and 10: debuggees of the runtime matrix
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Build
        id: build
        run: dotnet build -c Release

      # Later steps run even when an earlier one failed ("!cancelled()"): one run should show everything that is broken.
      - name: Test (adapter + engine through DAP)
        id: tests
        # Where debugging does not start at all, every test waits for its own timeout. The limit is on the step, not on
        # the job: a step that times out fails, and the diagnostics below are still collected.
        timeout-minutes: 45
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --blame-hang-timeout 5m
        env:
          DOTNET_DEBUGGER_STRESS: 1

      - name: Runtime matrix (.NET 8/9/10, self-contained, single-file, ReadyToRun)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 30
        run: dotnet test -c Release --no-build --filter "FullyQualifiedName~RuntimeMatrixTests" --logger "trx;LogFileName=matrix.trx"
        env:
          DOTNET_DEBUGGER_MATRIX: 1

      - name: Pack and install the .NET tool
        id: tool
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet pack src/DotnetDebugger.Adapter -c Release
          dotnet tool install dotnet-debugger-dap --tool-path artifacts/tool --add-source artifacts/packages --prerelease
          ./artifacts/tool/dotnet-debugger --version

      - name: Environment (for diagnosing failures)
        if: ${{ failure() }}
        shell: pwsh
        run: |
          dotnet --info
          if (-not $IsWindows) { uname -a }
          if ($IsMacOS) { sw_vers; csrutil status; codesign -d --entitlements - (Get-Command dotnet).Source 2>&1 }

      # the same suite once more: pointless (and slow) when it has already failed against the build output
      - name: Test the installed tool
        if: ${{ !cancelled() && steps.tool.outcome == 'success' && steps.tests.outcome == 'success' }}
        timeout-minutes: 45
        shell: pwsh
        run: |
          $exe = if ($IsWindows) { 'dotnet-debugger.exe' } else { 'dotnet-debugger' }
          $env:DOTNET_DEBUGGER_ADAPTER = Join-Path $PWD "artifacts/tool/$exe"
          dotnet test -c Release --no-build --filter "FullyQualifiedName!~RuntimeMatrixTests&FullyQualifiedName!~StressTests"

      - name: Publish the adapter
        id: publish
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./build/publish.ps1 -Rid ${{ matrix.rid }}

      - uses: actions/setup-node@v4
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json

      - name: VS Code extension (compile, integration tests, package)
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        working-directory: vscode
        shell: pwsh
        env:
          DOTNET_DEBUGGER_TEST_CONFIGURATION: Release
        run: |
          npm ci
          npm run compile
          if ($IsLinux) { xvfb-run -a node out/test/runTest.js } else { node out/test/runTest.js }
          npm run package -- ${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dotnet-debugger-${{ matrix.rid }}
          if-no-files-found: ignore
          path: |
            artifacts/publish/${{ matrix.rid }}
            artifacts/packages/*.nupkg
            vscode/*.vsix
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml

      # Adapter traces are large; they are only worth keeping when something failed.
      - uses: actions/upload-artifact@v4
        if: ${{ failure() || cancelled() }}
        with:
          name: test-logs-${{ matrix.rid }}
          if-no-files-found: ignore
          retention-days: 14
          path: artifacts/test-logs
