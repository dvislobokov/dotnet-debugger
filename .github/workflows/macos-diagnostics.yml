name: macOS diagnostics

# macOS cannot be tried locally, and a full CI run there ended with "the hosted runner lost communication": the machine
# was starved and took its logs with it. This workflow runs the suite in small chunks and uploads the adapter traces
# and a resource monitor after every chunk, so whatever happens last is still documented by the uploads before it.
# The launch tests run one by one: one of them is what kills the machine (basics, sessions and breakpoints are fine).
# Manual only: macOS minutes of a private repository are billed tenfold.
on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_DEBUGGER_TEST_LOG: ${{ github.workspace }}/artifacts/test-logs/

jobs:
  diagnose:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Allow debugging without a prompt
        run: |
          sudo /usr/sbin/DevToolsSecurity -enable
          sudo dseditgroup -o edit -a "$(whoami)" -t user _developer
          DevToolsSecurity -status
          sw_vers; sysctl -n hw.ncpu hw.memsize; csrutil status || true

      - name: Build
        run: dotnet build -c Release

      # every 5 seconds: load, free memory, how many processes of ours exist, who burns the CPU
      - name: Start the resource monitor
        run: |
          mkdir -p artifacts/test-logs
          nohup bash build/resource-monitor.sh artifacts/test-logs/monitor.log 5 > /dev/null 2>&1 &

      - name: Tests launch-01-UnknownProfileOrProjectFails
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.UnknownProfileOrProjectFails" --logger "console;verbosity=normal" --blame-hang-timeout 90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-01-UnknownProfileOrProjectFails
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-logs

      - name: Tests launch-02-LaunchSettingsCanBeUsedWithProgramAndDisabled
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.LaunchSettingsCanBeUsedWithProgramAndDisabled" --logger "console;verbosity=normal" --blame-hang-timeout 90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-02-LaunchSettingsCanBeUsedWithProgramAndDisabled
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-logs

      - name: Tests launch-03-DefaultLaunchProfileIsApplied
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.DefaultLaunchProfileIsApplied" --logger "console;verbosity=normal" --blame-hang-timeout 90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-03-DefaultLaunchProfileIsApplied
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-logs

      - name: Tests launch-04-NamedLaunchProfileAndOverrides
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.NamedLaunchProfileAndOverrides" --logger "console;verbosity=normal" --blame-hang-timeout 90s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-launch-04-NamedLaunchProfileAndOverrides
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-logs

      - name: Tests launch-05-ProjectIsResolvedToItsOutputAssembly
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.ProjectIsResolvedToItsOutputAssembly" --logger "console;verbosity=normal" --blame-hang-timeout 90s
