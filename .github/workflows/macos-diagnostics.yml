          path: artifacts/test-logs

      - name: Tests launch-11-RunInTerminalGivesTheDebuggeeARealStdin
        continue-on-error: true
        timeout-minutes: 3
        run: dotnet test tests/DotnetDebugger.Tests -c Release --no-build --filter "FullyQualifiedName~LaunchTests.RunInTerminalGivesTheDebuggeeARealStdin" --logger "console;verbosity=normal" --blame-hang-timeout 90s
